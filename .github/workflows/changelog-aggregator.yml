# @format

name: Changelog Aggregator

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "UTC date to aggregate (YYYY-MM-DD; blank uses yesterday)"
        required: false
        type: string
  schedule:
    # 13:00 UTC: 06:00 PDT / 05:00 PST
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: changelog-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Aggregate public repository changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [[ -n "$REPORT_DATE" ]]; then
            python utilities/github/changelog-aggregator/aggregate_changelogs.py \
              --date "$REPORT_DATE"
          else
            python utilities/github/changelog-aggregator/aggregate_changelogs.py
          fi

      - name: Commit updated aggregate
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "Add aggregated changelog"
          file_pattern: "utilities/github/changelog-aggregator/CHANGELOG-*.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
